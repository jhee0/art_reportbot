name: validation-check

on:
  schedule:
    - cron: '34 6 * * 1-5'   # 월-금 KST 15:34
    - cron: '34 8 * * 1-5'  # 월-금 KST 17:34
    - cron: '34 10 * * 1-5'  # 월-금 KST 19:34
  
  # 수동 실행도 가능하게
  workflow_dispatch:

jobs:
  validation-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log actual run time
      run: |
        echo "Triggered cron: ${{ github.event.schedule }}"
        echo "실행된 UTC 시각: $(date -u +'%Y-%m-%d %H:%M:%S')"
        echo "실행된 KST 시각: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')"
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install pandas python-dotenv slack-sdk selenium

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
        
    - name: Run validation check
      env:
        TU_EMAIL: ${{ secrets.TU_EMAIL }}
        TU_PASSWORD: ${{ secrets.TU_PASSWORD }}
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        SLACK_CHANNEL_VALIDATION: ${{ secrets.SLACK_CHANNEL_VALIDATION }}
        TZ: Asia/Seoul
      run: |
        python tu_downloader.py validation
        
    - name: Upload logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: validation-error-logs
        path: |
          *.log
